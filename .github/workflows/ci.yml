name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilar y probar (Windows)
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar paquetes
        run: dotnet restore VortexPad.sln

      - name: Compilar (Release, advertencias como error)
        run: dotnet build VortexPad.sln -c Release --no-restore -warnaserror

      - name: Ejecutar tests
        run: >
          dotnet test VortexPad.sln -c Release --no-build
          --logger "trx;LogFilePrefix=resultados"
          --results-directory TestResults

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tests
          path: TestResults/*.trx
          if-no-files-found: warn
